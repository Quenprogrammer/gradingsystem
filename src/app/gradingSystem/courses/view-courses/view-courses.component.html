

<div *ngFor="let course of courses$ | async" class="card mb-4">
  <div class="card-body">
    <table class="table table-bordered table-striped">
      <thead class="table-light">
      <tr>
        <th>Title</th>
        <th>Code</th>
        <th>Credit Unit</th>
        <th>Semester</th>
        <th>Level</th>
        <th>Lecturer</th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let course of courses$ | async">
        <!-- Use *ngIf for display/edit logic here -->
        <ng-container *ngIf="editingCourseId !== course.id; else editRow">
          <td>{{ course.title }}</td>
          <td>{{ course.code }}</td>
          <td>{{ course.creditUnit }}</td>
          <td>{{ course.semester }}</td>
          <td>{{ course.level }}</td>
          <td>{{ course.lecturer || 'N/A' }}</td>
          <td>
            <button class="btn btn-outline-primary btn-sm me-2" (click)="startEdit(course)">Edit</button>
            <button class="btn btn-outline-danger btn-sm" (click)="deleteCourse(course.id!)">Delete</button>
          </td>
        </ng-container>
        <ng-template #editRow>
          <!-- Editable row will go here -->
        </ng-template>
      </tr>
      </tbody>
    </table>



  </div>
  <div *ngIf="ModalOpen()" class="modal-overlay">
    <div class="modal-content">
      <div class="card h-100">
        <!-- Header -->
        <div class="card-header d-flex justify-content-end gap-2">
          <h2 class="card-header-title me-auto">Cover image</h2> <!-- Keeps title on the left -->
          <a class="btn btn-ghost-danger btn-sm" (click)="this.ModalOpen.set(false)">Close</a>

        </div>



        <div class="card-body-height p-3">
          <form [formGroup]="editForm" *ngIf="editingCourseId === course.id">
            <div class="row mb-3">
              <label class="col-sm-3 col-form-label form-label">Title</label>
              <div class="col-sm-9">
                <input type="text" formControlName="title" class="form-control" placeholder="Title" />
              </div>
            </div>

            <div class="row mb-3">
              <label class="col-sm-3 col-form-label form-label">Code</label>
              <div class="col-sm-9">
                <input type="text" formControlName="code" class="form-control" placeholder="Code" />
              </div>
            </div>

            <div class="row mb-3">
              <label class="col-sm-3 col-form-label form-label">Credit Unit</label>
              <div class="col-sm-9">
                <input type="number" formControlName="creditUnit" class="form-control" placeholder="Credit Unit" />
              </div>
            </div>

            <div class="row mb-3">
              <label class="col-sm-3 col-form-label form-label">Semester</label>
              <div class="col-sm-9">
                <select formControlName="semester" class="form-select">
                  <option value="First">First</option>
                  <option value="Second">Second</option>
                </select>
              </div>
            </div>

            <div class="row mb-3">
              <label class="col-sm-3 col-form-label form-label">Level</label>
              <div class="col-sm-9">
                <select formControlName="level" class="form-select">
                  <option>100L</option>
                  <option>200L</option>
                  <option>300L</option>
                  <option>400L</option>
                </select>
              </div>
            </div>

            <div class="row mb-4">
              <label class="col-sm-3 col-form-label form-label">Lecturer</label>
              <div class="col-sm-9">
                <input type="text" formControlName="lecturer" class="form-control" placeholder="Lecturer" />
              </div>
            </div>

            <div class="row">
              <div class="offset-sm-3 col-sm-9">
                <button type="button" class="btn btn-success me-2" (click)="updateCourse()">Update</button>
                <button type="button" class="btn btn-secondary" (click)="cancelEdit()">Cancel</button>
              </div>
            </div>
          </form>
        </div>

        <!-- End Body -->
      </div>
    </div>
  </div>
</div>

<div class="container mt-4 mb-5">
  <h3 class="mb-3">Add New Student</h3>

  <form [formGroup]="studentForm" (ngSubmit)="onSubmit()" class="row g-3">

    <div class="col-md-6">
      <label class="form-label">Full Name</label>
      <input type="text" class="form-control" formControlName="fullName">
    </div>

    <div class="col-md-6">
      <label class="form-label">Matric Number</label>
      <input type="text" class="form-control" formControlName="matricNumber">
    </div>

    <div class="col-md-6">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" formControlName="email">
    </div>

    <div class="col-md-6">
      <label class="form-label">Phone Number</label>
      <input type="tel" class="form-control" formControlName="phone">
    </div>

    <div class="col-md-6">
      <label class="form-label">Gender</label>
      <select class="form-select" formControlName="gender">
        <option value="" disabled>Select gender</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select>
    </div>

    <div class="col-md-6">
      <label class="form-label">Date of Birth</label>
      <input type="date" class="form-control" formControlName="dob">
    </div>

    <div class="col-md-6">
      <label class="form-label">Department</label>
      <input type="text" class="form-control" formControlName="department">
    </div>

    <div class="col-md-6">
      <label class="form-label">Level</label>
      <select class="form-select" formControlName="level">
        <option value="" disabled>Select level</option>
        <option>100</option>
        <option>200</option>
        <option>300</option>
        <option>400</option>
        <option>500</option>
      </select>
    </div>

    <div class="col-md-12">
      <label class="form-label">Course of Study</label>
      <input type="text" class="form-control" formControlName="course">
    </div>

    <div class="col-md-12">
      <label class="form-label">Address</label>
      <textarea class="form-control" rows="2" formControlName="address"></textarea>
    </div>

    <div class="col-md-6">
      <label class="form-label">Guardian Name</label>
      <input type="text" class="form-control" formControlName="guardianName">
    </div>

    <div class="col-md-6">
      <label class="form-label">Guardian Phone</label>
      <input type="tel" class="form-control" formControlName="guardianPhone">
    </div>

    <div class="col-12">
      <button type="submit" class="btn btn-primary w-100">Add Student</button>
    </div>
  </form>
</div>

<!-- Table: Display All Students -->
<table class="table table-striped table-bordered align-middle">
  <thead class="table-light">
  <tr>
    <th>Full Name</th>
    <th>Matric No</th>
    <th>Email</th>
    <th>Phone</th>
    <th>Gender</th>
    <th>DOB</th>
    <th>Department</th>
    <th>Level</th>
    <th>Course</th>
    <th>Address</th>
    <th>Guardian Info</th>
    <th class="text-center">Actions</th>
  </tr>
  </thead>
  <tbody>
  <tr *ngFor="let student of students$ | async">
    <ng-container *ngIf="editingId !== student.id; else editRow">


      <td class="text-nowrap text-center">
        <button class="btn btn-sm btn-outline-primary me-1" (click)="startEdit(student)">Edit</button>
        <button class="btn btn-sm btn-outline-danger" (click)="deleteStudent(student.id!)">Delete</button>
      </td>
    </ng-container>

    <ng-template #editRow>
      <!-- Only show modal if this student's ID is being edited -->
      <div *ngIf="ModalOpen() && editingId === student.id" class="modal-overlay">
        <div class="modal-content">
          <div class="card h-100">
            <!-- Header -->
            <div class="card-header d-flex justify-content-end gap-2">
              <h2 class="card-header-title me-auto">Edit Student</h2>
              <a class="btn btn-ghost-danger btn-sm" (click)="ModalOpen.set(false)">Close</a>
            </div>

            <!-- Form Body -->
            <div class="card-body-height p-3" style="height: 350px; overflow-y: scroll">
              <form [formGroup]="editForm" (ngSubmit)="updateStudent()" class="row g-3 mt-3">
                <div class="col-md-6">
                  <label class="form-label">Full Name</label>
                  <input type="text" formControlName="fullName" class="form-control" placeholder="Full Name">
                </div>

                <div class="col-md-6">
                  <label class="form-label">Matric No</label>
                  <input type="text" formControlName="matricNumber" class="form-control" placeholder="Matric No">
                </div>

                <div class="col-md-6">
                  <label class="form-label">Email</label>
                  <input type="email" formControlName="email" class="form-control" placeholder="Email">
                </div>

                <div class="col-md-6">
                  <label class="form-label">Phone</label>
                  <input type="tel" formControlName="phone" class="form-control" placeholder="Phone">
                </div>

                <div class="col-md-6">
                  <label class="form-label">Gender</label>
                  <select class="form-select" formControlName="gender">
                    <option value="" disabled>Select gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                  </select>
                </div>

                <div class="col-md-6">
                  <label class="form-label">Date of Birth</label>
                  <input type="date" formControlName="dob" class="form-control" placeholder="DOB">
                </div>

                <div class="col-md-6">
                  <label class="form-label">Department</label>
                  <input type="text" formControlName="department" class="form-control" placeholder="Department">
                </div>

                <div class="col-md-6">
                  <label class="form-label">Level</label>
                  <input type="text" formControlName="level" class="form-control" placeholder="Level">
                </div>

                <div class="col-md-6">
                  <label class="form-label">Course</label>
                  <input type="text" formControlName="course" class="form-control" placeholder="Course">
                </div>

                <div class="col-md-6">
                  <label class="form-label">Address</label>
                  <input type="text" formControlName="address" class="form-control" placeholder="Address">
                </div>

                <div class="col-md-6">
                  <label class="form-label">Guardian Name</label>
                  <input type="text" formControlName="guardianName" class="form-control" placeholder="Guardian Name">
                </div>

                <div class="col-md-6">
                  <label class="form-label">Guardian Phone</label>
                  <input type="tel" formControlName="guardianPhone" class="form-control" placeholder="Guardian Phone">
                </div>

                <div class="col-12 text-end">
                  <button type="submit" class="btn btn-success me-2">Update</button>
                  <button type="button" class="btn btn-secondary" (click)="cancelEdit()">Cancel</button>
                </div>
              </form>
            </div>
            <!-- End Body -->
          </div>
        </div>
      </div>
    </ng-template>
  </tr>
  </tbody>
</table>
